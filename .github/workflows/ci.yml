name: CI

on:
  push:
  pull_request:

jobs:
  build-test-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build library
        run: zig build
      - name: Run tests
        run: zig build test
      - name: Check formatting
        run: zig fmt --check src tests tools template examples build.zig build.zig.zon
